<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e3a" />
      <stop offset="100%" stop-color="#f13024" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e02015" />
      <stop offset="100%" stop-color="#ff7b54" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff5e3a" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="100" cy="100" r="70" fill="#f13024" opacity="0.15" filter="url(#subtleGlow)" />

  <!-- Main Stem of K -->
  <rect x="36" y="32" width="28" height="136" rx="8" fill="url(#grad1)" />
  <rect x="40" y="36" width="6" height="128" rx="3" fill="url(#glowGrad)" opacity="0.6" />

  <!-- Upper Diagonal Wing -->
  <path d="M 82 108 L 146 42 C 151 37 160 37 165 42 L 168 45 C 173 50 173 58 168 63 L 108 122 Z" fill="url(#grad1)" />
  <path d="M 85 106 L 144 47 C 147 44 152 44 155 47 L 157 49 C 160 52 160 56 157 59 L 105 112 Z" fill="#ffffff" opacity="0.35" />

  <!-- Lower Diagonal Leg -->
  <path d="M 98 108 L 158 157 C 163 161 165 168 161 174 L 158 178 C 153 184 145 184 140 180 L 76 128 Z" fill="url(#grad2)" />
  
  <!-- Modern Center Power Dot / Tech Pivot Accent -->
  <circle cx="92" cy="116" r="7" fill="#ffffff" filter="url(#subtleGlow)" />
</svg>

