<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7253" />
      <stop offset="50%" stop-color="#f13024" />
      <stop offset="100%" stop-color="#c9170c" />
    </linearGradient>
    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="softAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Ring Accent with Soft Glow -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#neonRed)" stroke-width="2.5" stroke-dasharray="140 340" stroke-linecap="round" />

  <!-- Dynamic Aerodynamic Flowing "K" Lettermark -->
  <!-- Left Elegant Pillar with Gradient -->
  <path d="M 58 42 C 58 37 62 34 67 34 C 72 34 76 37 76 42 L 76 158 C 76 163 72 166 67 166 C 62 166 58 163 58 158 Z" fill="url(#silverWhite)" />

  <!-- Upper Dynamic Arc / Wing -->
  <path d="M 76 104 C 92 88 116 66 138 46 C 142 42 148 43 151 47 C 154 51 153 57 149 61 C 129 80 106 102 96 112 Z" fill="url(#neonRed)" filter="url(#softAura)" />

  <!-- Lower Dynamic Sweep / Kick -->
  <path d="M 88 102 L 144 154 C 148 158 148 164 144 168 C 140 172 134 172 130 168 L 74 116 Z" fill="url(#neonRed)" />

  <!-- Center Orbit Dot -->
  <circle cx="82" cy="108" r="6" fill="#ffffff" />
  <circle cx="160" cy="100" r="4" fill="#f13024" />
</svg>

