<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="codeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="100%" stop-color="#f13024" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Capsule Base -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="#131424" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <circle cx="100" cy="100" r="55" fill="#f13024" opacity="0.12" filter="url(#neonBlur)" />

  <!-- Left Code Bracket "<" forming left side of K -->
  <path d="M 68 55 L 42 100 L 68 145" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Slash & Branches forming the K lettermark -->
  <line x1="88" y1="45" x2="88" y2="155" stroke="url(#codeGrad1)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Right Upper Angle Bracket Branch -->
  <path d="M 96 100 L 148 56" fill="none" stroke="url(#accentGrad)" stroke-width="13" stroke-linecap="round" />
  <circle cx="148" cy="56" r="6" fill="#ffffff" />

  <!-- Right Lower Angle Bracket Branch -->
  <path d="M 96 102 L 152 146" fill="none" stroke="url(#accentGrad)" stroke-width="13" stroke-linecap="round" />
  <circle cx="152" cy="146" r="6" fill="#f13024" />

  <!-- Center Floating Tech Core Point -->
  <circle cx="92" cy="101" r="5" fill="#ffffff" />
</svg>

