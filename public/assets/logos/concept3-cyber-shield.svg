<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e3a" />
      <stop offset="100%" stop-color="#f13024" />
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23243a" />
      <stop offset="100%" stop-color="#121320" />
    </linearGradient>
    <filter id="glowHex" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Outer Ambient Aura -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5" opacity="0.3" filter="url(#glowHex)" />

  <!-- Outer Isometric Hexagon -->
  <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" fill="url(#darkBgGrad)" stroke="url(#shieldGrad)" stroke-width="3" />

  <!-- Subtle Inner Grid / Hexagon Accent Line -->
  <polygon points="100,38 152,68 152,132 100,162 48,132 48,68" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Bold Geometric Futuristic "K" Inside -->
  <!-- Left Pillar -->
  <path d="M 66 58 L 84 58 L 84 142 L 66 142 Z" fill="#ffffff" />
  
  <!-- Diagonal Top Right Arm -->
  <polygon points="86,104 128,60 148,60 102,106" fill="url(#shieldGrad)" />
  <polygon points="128,60 148,60 144,65 125,65" fill="#ffffff" opacity="0.5" />

  <!-- Diagonal Bottom Right Leg -->
  <polygon points="98,102 148,142 128,142 82,108" fill="url(#shieldGrad)" />

  <!-- Signature Floating Red Core Pixel -->
  <circle cx="100" cy="100" r="4" fill="#ffffff" />
</svg>

